# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build Release

on:
  push:
    tags: 
    - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  create_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Create Release
      id: create_release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" \
          --title "Release ${{ github.ref_name }}" \
          --notes-file CHANGELOG.md \
          --draft || echo "Release already exists, skipping creation."

  build_release:
    runs-on: ubuntu-latest
    needs: create_release
    permissions:
      contents: write
    strategy:
      matrix:
        go-os: [ 'darwin', 'linux', 'windows' ]
        go-arch: [ 'arm64', 'amd64' ]
        
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.25
    
    - name: Install dependencies
      run: go get .

    - name: Build
      run: env GOOS=${{ matrix.go-os }} GOARCH=${{ matrix.go-arch }} go build -v -o ${{ matrix.go-os }}_${{ matrix.go-arch }}/

#    - name: Test
#      run: go test -v ./...

    - name: Tar
      run: tar -zcvf ${{ matrix.go-os }}_${{ matrix.go-arch }}.tar.gz ${{ matrix.go-os }}_${{ matrix.go-arch }}/*

#    - name: Upload artifacts
#      uses: actions/upload-artifact@v3
#      with:
#        name: build-${{ matrix.go-os }}_${{ matrix.go-arch }}
#        path: ${{ matrix.go-os }}_${{ matrix.go-arch }}.tar.gz

    - name: Upload release artifact
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ASSET_NAME="odm-${{ matrix.go-os }}_${{ matrix.go-arch }}.tar.gz"
        mv "./${{ matrix.go-os }}_${{ matrix.go-arch }}.tar.gz" "$ASSET_NAME"
        gh release upload "${{ github.ref_name }}" "$ASSET_NAME" --clobber
